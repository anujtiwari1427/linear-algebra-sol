<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Linear Algebra Solver — free online calculator for matrices, vectors, eigenvalues, and systems of equations.">
  <title>{% block title %}Linear Algebra Solver{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="app-layout">

{% include 'components/navbar.html' %}

<div class="app-main-content">
  <button class="btn btn-dark sidebar-open-btn shadow" id="sidebarOpenBtn" title="Open Navigation Menu">
    <span>☰</span> <span class="d-none d-sm-inline ms-1">Menu</span>
  </button>
  <main>
  {% block content %}{% endblock %}
  </main>

  {% include 'components/footer.html' %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
